                - generic [ref=f247e101]:
                  - paragraph [ref=f247e102]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
                  - paragraph [ref=f247e103]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
                  - paragraph [ref=f247e104]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
                  - paragraph [ref=f247e105]
                  - paragraph [ref=f247e106]:
                    - strong [ref=f247e107]: How it works
                  - list [ref=f247e108]:
                    - listitem [ref=f247e109]:
                      - strong [ref=f247e110]: Apply.
                      - text: Complete a short screener interview and upload your resume.
                    - listitem [ref=f247e111]:
                      - strong [ref=f247e112]: Propose.
                      - text: Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
                    - listitem [ref=f247e113]:
                      - strong [ref=f247e114]: Build.
                      - text: In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
                    - listitem [ref=f247e115]:
                      - strong [ref=f247e116]: Stress-test.
                      - text: Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
                    - listitem [ref=f247e117]:
                      - strong [ref=f247e118]: Model testing.
                      - text: Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
                    - listitem [ref=f247e119]:
                      - strong [ref=f247e120]: Review.
                      - text: A reviewer checks your task and you revise it. Most tasks take more than one round.
                    - listitem [ref=f247e121]:
                      - strong [ref=f247e122]: Next task.
                      - text: Once your task is accepted, start another.
                  - paragraph [ref=f247e123]
                  - paragraph [ref=f247e124]:
