          - generic [ref=f58e60]:
            - heading "Who we are" [level=3] [ref=f58e61]
            - paragraph [ref=f58e62]: Typeform is a refreshingly different form builder. We help over 150,000 businesses collect the data they need with forms, surveys, and quizzes that people enjoy. Designed to look striking and feel effortless to fill out, Typeform drives 500 million responses every year—and integrates with essential tools like Slack, Zapier, and Hubspot.
          - paragraph [ref=f58e63]:
            - generic [ref=f58e64]:
              - text: Typeform is fully remote by design. For this role, we can hire candidates based in the UK, Ireland, Germany, Portugal, Spain or The Netherlands
              - strong [ref=f58e65]: About the team
          - paragraph [ref=f58e66]: Typeform is a leading provider of interactive forms, surveys, and data collection experiences. We help businesses create more engaging ways to collect, manage, and understand data.
          - paragraph [ref=f58e67]: This team sits at the center of how Typeform builds product experiences, creating the shared foundations, tooling, and infrastructure that support scalable and consistent development across the platform.
          - heading [level=2] [ref=f58e68]:
            - strong [ref=f58e70]: About the role
          - paragraph [ref=f58e71]: We’re looking for a Mid level Full Stack Engineer with a stronger backend focus to help evolve the internal systems and infrastructure that support our product development ecosystem.
          - paragraph [ref=f58e72]: This role is ideal for someone who enjoys building scalable internal platforms and developer tooling, while still being comfortable contributing across the frontend when needed. You’ll work on APIs, automation, release pipelines, and engineering infrastructure that improve how teams build and ship product experiences across Typeform.
          - paragraph [ref=f58e73]: You’ll partner closely with engineers and designers to improve tooling, workflows, and developer experience across the company.
          - heading [level=2] [ref=f58e74]:
            - strong [ref=f58e76]: Things you will do
          - list [ref=f58e77]:
            - listitem [ref=f58e78]: Build and maintain backend services, APIs, and internal tooling used across product development teams
            - listitem [ref=f58e79]: Improve infrastructure powering component distribution, asset management, documentation, and release workflows
            - listitem [ref=f58e80]: Support and evolve the engineering monorepo, helping improve scalability, maintainability, and developer experience
            - listitem [ref=f58e81]: Collaborate with frontend engineers and designers to ensure shared patterns and tooling are implemented consistently across products
            - listitem [ref=f58e82]: Contribute to CI/CD pipelines, automation, testing, and deployment processes using tools like GitHub Actions
            - listitem [ref=f58e83]: Help improve the reliability and performance of internal systems, including observability and monitoring workflows
            - listitem [ref=f58e84]: Support engineers across product teams with adoption and integration of shared tooling and services
            - listitem [ref=f58e85]: Contribute to documentation and developer tooling to improve discoverability and onboarding
            - listitem [ref=f58e86]:
              - text: "Work on ongoing platform improvements, including:"
              - list [ref=f58e87]:
                - listitem [ref=f58e88]: Migration of legacy code and tooling
                - listitem [ref=f58e89]: Documentation platform enhancements
                - listitem [ref=f58e90]: Automation improvements
                - listitem [ref=f58e91]: Sandbox and developer tooling improvements
            - listitem [ref=f58e92]: Participate in architecture discussions and contribute practical, scalable engineering solutions
          - heading [level=2] [ref=f58e93]:
            - strong [ref=f58e95]: What you already bring to the table
          - list [ref=f58e96]:
            - listitem [ref=f58e97]: Experience working with JavaScript or TypeScript in production environments
            - listitem [ref=f58e98]: Good understanding of backend development principles and experience building APIs or internal services
            - listitem [ref=f58e99]: Familiarity with Node.js and modern web frameworks such as React or Next.js
            - listitem [ref=f58e100]: Experience working with relational databases and understanding of database design fundamentals
            - listitem [ref=f58e101]: Understanding of testing practices and software quality principles
            - listitem [ref=f58e102]: Familiarity with CI/CD workflows and developer tooling
            - listitem [ref=f58e103]: Experience working with Git and collaborative engineering workflows
            - listitem [ref=f58e104]: Strong communication skills and the ability to work cross functionally with designers and engineers
            - listitem [ref=f58e105]: Interest in developer experience, platform engineering, or internal tooling
          - heading [level=2] [ref=f58e106]:
            - strong [ref=f58e108]: Extra awesome
          - list [ref=f58e109]:
            - listitem [ref=f58e110]: Experience working in a product led SaaS company
            - listitem [ref=f58e111]: Exposure to frontend infrastructure or shared platform tooling
            - listitem [ref=f58e112]: Familiarity with observability and monitoring tooling
            - listitem [ref=f58e113]: Experience contributing to monorepos or internal platform tooling
            - listitem [ref=f58e114]: Degree in Computer Science or a related technical field
