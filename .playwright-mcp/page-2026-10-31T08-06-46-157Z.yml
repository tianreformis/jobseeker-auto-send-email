      - heading "[Hiring] Software Engineer, AI Coding Tasks @Askable" [level=1] [ref=f36e20]
      - paragraph [ref=f36e21]: "Oct 17, 2026 - Askable is hiring a remote Software Engineer, AI Coding Tasks. 💸 Salary: $1000 per task. 📍Location: Worldwide."
      - generic [ref=f36e24]:
        - generic [ref=f36e25]:
          - paragraph [ref=f36e26]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
          - paragraph [ref=f36e27]
          - paragraph [ref=f36e28]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
          - paragraph [ref=f36e29]
          - paragraph [ref=f36e30]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
          - paragraph [ref=f36e31]
          - paragraph [ref=f36e32]: How it works
          - paragraph [ref=f36e33]
          - list [ref=f36e34]:
            - listitem [ref=f36e35]: Apply. Complete a short screener interview and upload your resume.
            - listitem [ref=f36e36]: Propose. Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
            - listitem [ref=f36e37]: Build. In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
            - listitem [ref=f36e38]: Stress-test. Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
            - listitem [ref=f36e39]: Model testing. Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
            - listitem [ref=f36e40]: Review. A reviewer checks your task and you revise it. Most tasks take more than one round.
            - listitem [ref=f36e41]: Next task. Once your task is accepted, start another.
          - paragraph [ref=f36e42]
          - paragraph [ref=f36e43]: Requirements
          - paragraph [ref=f36e44]
          - list [ref=f36e45]:
            - listitem [ref=f36e46]: 2+ years of professional software engineering
            - listitem [ref=f36e47]: Code merged into a public open-source repository, ideally one you know well. A private codebase you own may also qualify (not employer or client code)
            - listitem [ref=f36e48]: Strong in at least one of Python, TypeScript, Go, Rust, Java or C++
            - listitem [ref=f36e49]: Solid with Docker, Linux, Git and automated testing
            - listitem [ref=f36e50]: Regular use of an AI coding tool
            - listitem [ref=f36e51]: Experience writing tests, rubrics or evaluation criteria, ideally for AI models
            - listitem [ref=f36e52]: You can explain a change clearly and concisely, in your own words
            - listitem [ref=f36e53]: At least 10 hours a week, starting now
            - listitem [ref=f36e54]: A secure personal or work computer (no public or shared machines)
          - paragraph [ref=f36e55]
          - paragraph [ref=f36e56]: Nice to have
          - paragraph [ref=f36e57]
          - list [ref=f36e58]:
            - listitem [ref=f36e59]: Deep expertise in one area, such as databases, compilers, distributed systems, security or infrastructure
            - listitem [ref=f36e60]: Experience building agent tasks or RL environments
          - paragraph [ref=f36e61]
          - paragraph [ref=f36e62]: Terms
          - paragraph [ref=f36e63]
          - list [ref=f36e64]:
            - listitem [ref=f36e65]: US$1,000 for each task that passes our quality review, paid directly to you
            - listitem [ref=f36e66]: Once your proposal is qualified, you sign Askable's contract and accept its terms
            - listitem [ref=f36e67]: The work is used for AI training. The change and your solution must be your own, and you must be free to license them to us
            - listitem [ref=f36e68]: "Don't publish the work anywhere: no public pull request or public fork"
          - paragraph [ref=f36e69]
          - paragraph [ref=f36e70]: Apply at https://www.askable.com/experts/roles/senior-software-engineer
