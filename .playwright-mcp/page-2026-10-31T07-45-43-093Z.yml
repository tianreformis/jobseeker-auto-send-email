                - generic [ref=f10e98]:
                  - paragraph [ref=f10e99]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
                  - paragraph [ref=f10e100]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
                  - paragraph [ref=f10e101]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
                  - paragraph [ref=f10e102]
                  - paragraph [ref=f10e103]:
                    - strong [ref=f10e104]: How it works
                  - list [ref=f10e105]:
                    - listitem [ref=f10e106]:
                      - strong [ref=f10e107]: Apply.
                      - text: Complete a short screener interview and upload your resume.
                    - listitem [ref=f10e108]:
                      - strong [ref=f10e109]: Propose.
                      - text: Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
                    - listitem [ref=f10e110]:
                      - strong [ref=f10e111]: Build.
                      - text: In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
                    - listitem [ref=f10e112]:
                      - strong [ref=f10e113]: Stress-test.
                      - text: Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
                    - listitem [ref=f10e114]:
                      - strong [ref=f10e115]: Model testing.
                      - text: Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
                    - listitem [ref=f10e116]:
                      - strong [ref=f10e117]: Review.
                      - text: A reviewer checks your task and you revise it. Most tasks take more than one round.
                    - listitem [ref=f10e118]:
                      - strong [ref=f10e119]: Next task.
                      - text: Once your task is accepted, start another.
                  - paragraph [ref=f10e120]
                  - paragraph [ref=f10e121]:
                    - strong [ref=f10e122]: Requirements
                  - list [ref=f10e123]:
                    - listitem [ref=f10e124]: 2+ years of professional software engineering
                    - listitem [ref=f10e125]: Code merged into a public open-source repository, ideally one you know well. A private codebase you own may also qualify (not employer or client code)
                    - listitem [ref=f10e126]: Strong in at least one of Python, TypeScript, Go, Rust, Java or C++
                    - listitem [ref=f10e127]: Solid with Docker, Linux, Git and automated testing
                    - listitem [ref=f10e128]: Regular use of an AI coding tool
                    - listitem [ref=f10e129]: Experience writing tests, rubrics or evaluation criteria, ideally for AI models
                    - listitem [ref=f10e130]: You can explain a change clearly and concisely, in your own words
                    - listitem [ref=f10e131]: At least 10 hours a week, starting now
                    - listitem [ref=f10e132]: A secure personal or work computer (no public or shared machines)
                  - paragraph [ref=f10e133]
