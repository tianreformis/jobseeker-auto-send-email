                  - heading "Remote Frontend Engineer" [level=1] [ref=f39e108]
                - generic [ref=f39e109]:
                  - paragraph [ref=f39e110]: About ActAIThere are over 5 billion users using basic applications today such email, notes, tasks, calendar and they're not AI-native. Our mission is to build proactive applications for anyone in the world, who are not used to complex prompting. We aim to bring intelligence to conversations, errands, organising and workflows, with minimal to no prompting. Our application focuses on achieving high reliability for long-running workflows, persistent context, and real-world task completion. We believe products will greatly reduce hallucinationsOur objective is to organise anyone's life. RoleAs a Web Frontend Engineer, you will build the core web experiences, including Chat, Notes, Calendar, Docs and Sheets.You will own complex, highly interactive product surfaces from architecture through implementation, working closely with product, design, backend and AI engineers to make AI a native part of how users communicate, write, organise and work. What You'll Own* Build major web experiences across Chat, Notes, Calendar, Docs, and Sheets.
                  - list [ref=f39e111]:
                    - listitem [ref=f39e112]: Develop complex interactions including real-time messaging, collaborative editing, rich-text editing, scheduling, tables, and spreadsheets.
                    - listitem [ref=f39e113]: Build reusable frontend architecture and components that work consistently across ActAI applications.
                    - listitem [ref=f39e114]: Integrate streaming AI responses, proactive actions, and model-driven experiences directly into product workflows.
                    - listitem [ref=f39e115]: Own frontend performance, responsiveness, reliability and accessibility across browsers and devices.
                    - listitem [ref=f39e116]: Work closely with product and design to take ideas from prototype to production quickly.
                  - paragraph [ref=f39e117]: What We're Looking For* Strong experience building complex, production web applications using React, TypeScript and modern frontend technologies.
                  - list [ref=f39e118]:
                    - listitem [ref=f39e119]: Deep understanding of frontend architecture, state management, browser APIs, and performance.
                    - listitem [ref=f39e120]: Experience building highly interactive products such as chat, collaboration, productivity, document editing, calendars, or workspaces.
                    - listitem [ref=f39e121]: Experience with real-time systems, WebSockets, streaming APIs, or collaborative interfaces.
                    - listitem [ref=f39e122]: Strong product and UI judgment with attention to interaction details.
                    - listitem [ref=f39e123]: Able to independently own features from technical design through production.
                  - paragraph [ref=f39e124]: Outcomes* Users can communicate, write, organise and collaborate seamlessly across Chat, Notes, Calendar, Docs and Sheets.
                  - list [ref=f39e125]:
                    - listitem [ref=f39e126]: Complex interactions such as group messaging, editing, scheduling and collaboration feel fast and reliable.
                    - listitem [ref=f39e127]: AI capabilities are integrated naturally into product workflows rather than added as separate chatbot experiences.
                    - listitem [ref=f39e128]: Frontend architecture remains fast, maintainable and reusable as ActAI expands into new applications and workflows.
                  - paragraph [ref=f39e129]: Tech Stack* TypeScript
                  - list [ref=f39e130]:
                    - listitem [ref=f39e131]: React.js / Next.js
                    - listitem [ref=f39e132]: HTML / CSS
                    - listitem [ref=f39e133]: WebSockets / streaming APIs
                    - listitem [ref=f39e134]: Node.js
                    - listitem [ref=f39e135]: REST / GraphQL APIs
                  - paragraph [ref=f39e136]: How We WorkThe best products today in the world were built by small, world-class teams. We are a high talent density and hands-on team. We make decisions collectively and move at rapid speed, striking a balance between shipping high-quality work and learning.Joining our team requires the ability to bring structure, exercise judgment and execute independently. Our goal is to put in the hands of our users a truly magical product. Interview ProcessIf there appears to be a fit, we'll reach out to schedule 3, but no more than 4 interviews.Applications are evaluated by our technical team members. Interviews will be conducted via virtual meetings and/or onsite.We value transparency and efficiency, so expect a prompt decision. If you've demonstrated the exceptional skills and mindset we're looking for, we'll extend an offer to join us and help bring practical AI benefits to billions of users globally.
