            - strong [ref=f119e65]: Senior Independent AI Engineer / Architect
          - paragraph [ref=f119e66]:
            - emphasis [ref=f119e67]: Remote | Americas, Europe, or Israel
          - paragraph [ref=f119e68]: Most AI engineers can find work.
          - paragraph [ref=f119e69]: Finding work worth doing is harder.
          - paragraph [ref=f119e70]: A.Team is an invite-only network of senior AI engineers, ML engineers, and AI architects working on production AI systems for startups, scale-ups, and global companies.
          - paragraph [ref=f119e71]: Since 2020, builders in the network have earned more than $200M working with companies including Lyft, Google X, HCA, Unilever, Sightful, D-ID, and others.
          - paragraph [ref=f119e72]:
            - strong [ref=f119e73]: The Work
          - paragraph [ref=f119e74]: You'll join small teams tackling problems that matter.
          - paragraph [ref=f119e75]: Not demos.
          - paragraph [ref=f119e76]: Not prototypes that never ship.
          - paragraph [ref=f119e77]: Not another chatbot wrapper.
          - paragraph [ref=f119e78]: Real systems. Real users. Real outcomes.
          - paragraph [ref=f119e79]:
            - strong [ref=f119e80]: "Recent work has included:"
          - paragraph [ref=f119e81]: "- LLM-powered products and workflows- Agent architectures and orchestration systems- Retrieval, evaluation, and reliability infrastructure- Enterprise AI deployments- AI-native products built from zero to one- Machine learning platforms operating at scale"
          - paragraph [ref=f119e82]: You'll work directly with founders, CTOs, and product leaders, helping shape both the technical approach and the outcome.
          - paragraph [ref=f119e83]:
            - strong [ref=f119e84]: Why Builders Join
          - paragraph [ref=f119e85]: "Most independent engineers eventually run into the same problem:"
          - paragraph [ref=f119e86]: The best opportunities rarely make it to the open market.
          - paragraph [ref=f119e87]: A.Team exists to solve that.
          - paragraph [ref=f119e88]: No bidding.
          - paragraph [ref=f119e89]: No prospecting.
          - paragraph [ref=f119e90]: No competing with thousands of other freelancers.
          - paragraph [ref=f119e91]: Just access to ambitious companies, difficult problems, and experienced peers.
          - paragraph [ref=f119e92]:
            - strong [ref=f119e93]: Who Thrives Here
          - paragraph [ref=f119e94]: People who have already shipped.
          - paragraph [ref=f119e95]: Engineers who have deployed AI systems into production, understand the tradeoffs behind the hype, and know how to turn research into business value.
          - paragraph [ref=f119e96]:
            - emphasis [ref=f119e97]: "You might be an:"
          - paragraph [ref=f119e98]: "- AI Architect- AI Engineer- MLOps- Deep Learning Engineer- Data Scientist- Applied AI Engineer- ML Engineer- AI Researcher- Staff+ Engineer focused on AI- Technical founder with deep AI experience"
          - paragraph [ref=f119e99]: What matters is a track record of building and shipping.
