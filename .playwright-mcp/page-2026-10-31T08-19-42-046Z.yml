        - generic [ref=f197e62]:
          - paragraph [ref=f197e63]:
            - text: Are you a talented Senior Developer looking for a remote job that lets you show your skills and get decent compensation? Look no further than
            - link "Lemon.io" [ref=f197e64] [cursor=pointer]:
              - /url: https://lemon.io/for-developers/?utm_source=weworkremotely&utm_medium=job_ad&utm_campaign=supply_en_angular_net/php/node_oct_2026_job_ad
            - text: — the marketplace that connects you with hand-picked startups in the US and Europe.
          - paragraph [ref=f197e65]:
            - strong [ref=f197e66]: "What we offer:"
          - list [ref=f197e67]:
            - listitem [ref=f197e68]: The rate depends on your seniority level, skills and experience. We've already paid out over $11M to our engineers.
            - listitem [ref=f197e69]: No more hunting for clients or negotiating rates — let us handle the business side of things so you can focus on what you do best.
            - listitem [ref=f197e70]: We'll manually find the best project for you according to your skills and preferences.
            - listitem [ref=f197e71]: Choose a schedule that works best for you. It’s possible to communicate async or minimally overlap within team working hours.
            - listitem [ref=f197e72]: We respect your seniority so you can expect no micromanagement or screen trackers.
            - listitem [ref=f197e73]: Communicate directly with the clients. Most of them have technical backgrounds. Sounds good, yeah?
            - listitem [ref=f197e74]: We will support you from the time you submit the application throughout all cooperation stages.
            - listitem [ref=f197e75]: Most of our projects involve working in a fast-paced startup environment. We hope you like it as much as we do.
            - listitem [ref=f197e76]: Through our community, we will connect you with the best developers from more than 75 countries.
          - paragraph [ref=f197e77]: "We have several senior positions available. We are looking for Senior Software Engineers with strong knowledge of the following stacks: Angular & PHP, Angular & .NET & TypeScript, Angular & Node, Angular & TypeScript, React & PHP, Vue & PHP, Symfony & any front-end, and PHP & Laravel."
          - paragraph [ref=f197e78]:
            - strong [ref=f197e79]: "Requirements for Senior Angular & PHP Developer experience:"
          - list [ref=f197e80]:
            - listitem [ref=f197e81]: 4+ years of software development experience
            - listitem [ref=f197e82]: 3+ years of experience with Angular
            - listitem [ref=f197e83]: 3+ years of commercial experience with PHP
            - listitem [ref=f197e84]: 3+ years of commercial experience with Laravel
          - paragraph [ref=f197e85]:
            - strong [ref=f197e86]: "Requirements for Senior Angular & .NET Developer experience:"
          - list [ref=f197e87]:
            - listitem [ref=f197e88]: 5+ years of software development experience
            - listitem [ref=f197e89]: 3+ years of experience with Angular and 5+ years of commercial experience with .NETOR5+ years of experience with Angular and 3+ years of commercial experience with .NET
            - listitem [ref=f197e90]: Practical experience with Typescript is required
          - paragraph [ref=f197e91]:
            - strong [ref=f197e92]: "Requirements for Senior Angular & Node.js Developer experience:"
          - list [ref=f197e93]:
            - listitem [ref=f197e94]: 5+ years of software development experience
            - listitem [ref=f197e95]: 3+ years of experience with Angular and 3+ years of commercial experience with Node.js
            - listitem [ref=f197e96]: Practical experience with Typescript is required
            - listitem [ref=f197e97]: Experience with AWS/GCP/Azure
          - paragraph [ref=f197e98]:
            - strong [ref=f197e99]: "Other requirements:"
          - list [ref=f197e100]:
            - listitem [ref=f197e101]: "Strong technical skills: as a Senior Developer, you are expected to be able to create projects from scratch and have a deep understanding of application architecture."
            - listitem [ref=f197e102]: Clear and effective communication in English — advanced ability to discuss business tasks, justify decisions, and communicate issues. Good self-presentation is also essential for upcoming client calls.
            - listitem [ref=f197e103]: Strong self-organizational skills — ability to work full-time remotely with no supervision.
            - listitem [ref=f197e104]: Reliability — we want to trust you and expect that you won’t let us and the client down.
            - listitem [ref=f197e105]: Adaptability and Flexibility — the ability to onboard the project promptly after accepting it and start delivering results quickly.
          - paragraph [ref=f197e106]:
            - text: Sounds good for you? Apply now and join the
            - link "Lemon.io" [ref=f197e107] [cursor=pointer]:
              - /url: https://lemon.io/for-developers/?utm_source=weworkremotely&utm_medium=job_ad&utm_campaign=supply_en_angular_net/php/node_oct_2026_job_ad
            - text: community!
          - paragraph [ref=f197e108]:
            - strong [ref=f197e109]: NOT YOUR TECH STACK?
          - paragraph [ref=f197e110]: We're placing Senior Developers (4+ yrs commercial experience) across AI Agent Architecture, AI Automation Architecture, AI Engineering, Site Reliability Engineering, Platform Engineering, React & Python, React & Golang, Golang, React & Java, React & Ruby, Ruby, PHP & Vue, Vue & Node.js, React & .NET, Android & iOS, iOS & Swift, Flutter & Firebase, Solutions Engineer, Blockchain (Ethereum/Ethers.js/Wagmi/Viem/Solana), Vue & .NET, Python & Vue, DevOps, MLOps, Data Science, Symfony & React, Symfony & Vue, Symfony & Angular, Python, Symfony & JavaScript & Next.js & TypeScript, Data Analysis, React & PHP, Data Engineering, Project Management, Product Management, QA Automation, QA Manual, Embedded Software Engineering, React Native & Node, React Native & React, React Native & Ruby, React Native & Python, WordPress, Android, Data Annotation, Angular, Python & Node, React & Node.js, Java & Spring, Svelte & Python, Svelte & Node.js, Svelte & TypeScript, Rust, Shopify & JavaScript, Vue & Nuxt, PHP & Laravel, UI/UX Design, Animation, Graphic Design, React & Node & React Native, .NET & C#, Electron, Scala, C++, Unreal Engine & C++, Python & LLM, Unity, or Machine Learning Engineering and more. Reach out and we'll match you.
          - paragraph [ref=f197e111]: We do not provide visa assistance, and our cooperation model does not include the benefits typically offered with direct hire.
          - paragraph [ref=f197e112]: We work with developers from 75+ countries across Europe, Latin America, North America (the U.S. and Canada), selected countries in Asia (Japan, Singapore, South Korea, the Philippines, Indonesia, Malaysia, Vietnam, Thailand, and Israel), Oceania (Australia, New Zealand, and Papua New Guinea), and Africa (including Morocco and South Africa).
