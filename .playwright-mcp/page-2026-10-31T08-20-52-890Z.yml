          - paragraph [ref=f305e68]: Most AI engineers can find work.
          - paragraph [ref=f305e69]: Finding work worth doing is harder.
          - paragraph [ref=f305e70]: A.Team is an invite-only network of senior AI engineers, ML engineers, and AI architects working on production AI systems for startups, scale-ups, and global companies.
          - paragraph [ref=f305e71]: Since 2020, builders in the network have earned more than $200M working with companies including Lyft, Google X, HCA, Unilever, Sightful, D-ID, and others.
          - paragraph [ref=f305e72]:
            - strong [ref=f305e73]: The Work
          - paragraph [ref=f305e74]: You'll join small teams tackling problems that matter.
          - paragraph [ref=f305e75]: Not demos.
          - paragraph [ref=f305e76]: Not prototypes that never ship.
          - paragraph [ref=f305e77]: Not another chatbot wrapper.
          - paragraph [ref=f305e78]: Real systems. Real users. Real outcomes.
          - paragraph [ref=f305e79]:
            - strong [ref=f305e80]: "Recent work has included:"
          - paragraph [ref=f305e81]: "- LLM-powered products and workflows- Agent architectures and orchestration systems- Retrieval, evaluation, and reliability infrastructure- Enterprise AI deployments- AI-native products built from zero to one- Machine learning platforms operating at scale"
          - paragraph [ref=f305e82]: You'll work directly with founders, CTOs, and product leaders, helping shape both the technical approach and the outcome.
          - paragraph [ref=f305e83]:
            - strong [ref=f305e84]: Why Builders Join
          - paragraph [ref=f305e85]: "Most independent engineers eventually run into the same problem:"
          - paragraph [ref=f305e86]: The best opportunities rarely make it to the open market.
          - paragraph [ref=f305e87]: A.Team exists to solve that.
          - paragraph [ref=f305e88]: No bidding.
          - paragraph [ref=f305e89]: No prospecting.
          - paragraph [ref=f305e90]: No competing with thousands of other freelancers.
          - paragraph [ref=f305e91]: Just access to ambitious companies, difficult problems, and experienced peers.
          - paragraph [ref=f305e92]:
            - strong [ref=f305e93]: Who Thrives Here
          - paragraph [ref=f305e94]: People who have already shipped.
          - paragraph [ref=f305e95]: Engineers who have deployed AI systems into production, understand the tradeoffs behind the hype, and know how to turn research into business value.
