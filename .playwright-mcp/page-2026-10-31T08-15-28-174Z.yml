                  - heading "Remote Software Engineer AI Coding Tasks" [level=1] [ref=f92e100]
                - generic [ref=f92e101]:
                  - paragraph [ref=f92e102]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
                  - paragraph [ref=f92e103]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
                  - paragraph [ref=f92e104]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
                  - paragraph [ref=f92e105]
                  - paragraph [ref=f92e106]:
                    - strong [ref=f92e107]: How it works
                  - list [ref=f92e108]:
                    - listitem [ref=f92e109]:
                      - strong [ref=f92e110]: Apply.
                      - text: Complete a short screener interview and upload your resume.
                    - listitem [ref=f92e111]:
                      - strong [ref=f92e112]: Propose.
                      - text: Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
                    - listitem [ref=f92e113]:
                      - strong [ref=f92e114]: Build.
                      - text: In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
                    - listitem [ref=f92e115]:
                      - strong [ref=f92e116]: Stress-test.
                      - text: Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
                    - listitem [ref=f92e117]:
                      - strong [ref=f92e118]: Model testing.
                      - text: Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
                    - listitem [ref=f92e119]:
                      - strong [ref=f92e120]: Review.
                      - text: A reviewer checks your task and you revise it. Most tasks take more than one round.
                    - listitem [ref=f92e121]:
                      - strong [ref=f92e122]: Next task.
                      - text: Once your task is accepted, start another.
                  - paragraph [ref=f92e123]
                  - paragraph [ref=f92e124]:
                    - strong [ref=f92e125]: Requirements
                  - list [ref=f92e126]:
                    - listitem [ref=f92e127]: 2+ years of professional software engineering
                    - listitem [ref=f92e128]: Code merged into a public open-source repository, ideally one you know well. A private codebase you own may also qualify (not employer or client code)
                    - listitem [ref=f92e129]: Strong in at least one of Python, TypeScript, Go, Rust, Java or C++
                    - listitem [ref=f92e130]: Solid with Docker, Linux, Git and automated testing
                    - listitem [ref=f92e131]: Regular use of an AI coding tool
                    - listitem [ref=f92e132]: Experience writing tests, rubrics or evaluation criteria, ideally for AI models
                    - listitem [ref=f92e133]: You can explain a change clearly and concisely, in your own words
                    - listitem [ref=f92e134]: At least 10 hours a week, starting now
                    - listitem [ref=f92e135]: A secure personal or work computer (no public or shared machines)
                  - paragraph [ref=f92e136]
                  - paragraph [ref=f92e137]:
                    - strong [ref=f92e138]: Nice to have
                  - list [ref=f92e139]:
                    - listitem [ref=f92e140]: Deep expertise in one area, such as databases, compilers, distributed systems, security or infrastructure
                    - listitem [ref=f92e141]: Experience building agent tasks or RL environments
