      - heading "[Hiring] Tech Lead Full-Stack Rails Engineer @Mitre Media" [level=1] [ref=f33e20]
      - paragraph [ref=f33e21]: "Oct 14, 2026 - Mitre Media is hiring a remote Tech Lead Full-Stack Rails Engineer. 💸 Salary: $170k - $200k. 📍Location: USA, Canada, USA timezones."
      - generic [ref=f33e24]:
        - generic [ref=f33e25]:
          - paragraph [ref=f33e26]: About Mitre Media
          - paragraph [ref=f33e27]: Mitre Media is redefining FinTech with AI-driven tools that empower millions of investors. Our portfolio, including Dividend.com and MutualFunds.com, leverages LLMs to deliver novel data insights and visually rich user experiences. For over a decade, we’ve served individual investors, financial advisors, and top asset managers like BlackRock and Vanguard through our premium data, tools, and advertising solutions. Join our lean, entrepreneurial team to shape the future of AI-powered investing from your location ±3 hours from Eastern Time.
          - paragraph [ref=f33e28]: Our users are deeply engaged, spending over 5 minutes per visit with a bounce rate below 10%, researching investments across hundreds of different categories. With 40 million brokerage accounts in the U.S., we take pride in building tools that make a real impact, fostering a culture of trust, innovation, and dynamism. If you’re passionate about financial technology and AI, we’d love to connect!
          - paragraph [ref=f33e29]: About the Role
          - paragraph [ref=f33e30]: As a Full-Stack Rails Tech Lead, you’ll architect and implement LLM-powered web applications within our microservices-based Rails 8 platform. Reporting directly to our CTO, you’ll collaborate with a small, high-impact team to deliver user experiences across Dividend.com, MutualFunds.com and other brands within our portfolio. This role combines expert Ruby on Rails skills with AI integration expertise, requiring you to leverage LLMs in your development workflow, state management and user interactions.
          - paragraph [ref=f33e31]: You’ll work in a remote-first hybrid environment, which encourages in person collaboration, using ShapeUp to manage projects that trade-off on-time delivery for de-scoped outcomes. As a technical leader, you'll have a seat at the table shaping system architecture, implementing core features all while embracing an entrepreneurial mindset and a “get things done” mentality.
          - paragraph [ref=f33e32]: Responsibilities
          - list [ref=f33e33]:
            - listitem [ref=f33e34]:
              - paragraph [ref=f33e35]: Architect and maintain Rails applications (Rails 8)
            - listitem [ref=f33e36]:
              - paragraph [ref=f33e37]: Integrate LLMs into our microservices architecture for state management and real-time user experiences.
            - listitem [ref=f33e38]:
              - paragraph [ref=f33e39]: Enhance front-end experiences with Hotwire, StimulusJS, or React, ensuring seamless AI-driven interactions.
            - listitem [ref=f33e40]:
              - paragraph [ref=f33e41]: Optimize LLM inference for low latency and cost, using caching and asynchronous processing.
          - paragraph [ref=f33e42]: Required Technical Skills
          - paragraph [ref=f33e43]: Back-End
          - list [ref=f33e44]:
            - listitem [ref=f33e45]:
              - paragraph [ref=f33e46]: Ruby (5+ years, expert-level)
            - listitem [ref=f33e47]:
              - paragraph [ref=f33e48]: Ruby on Rails (Rails 6-8 preferred)
            - listitem [ref=f33e49]:
              - paragraph [ref=f33e50]: PostgreSQL (or MySQL)
            - listitem [ref=f33e51]:
              - paragraph [ref=f33e52]: Elasticsearch
            - listitem [ref=f33e53]:
              - paragraph [ref=f33e54]: Redis
            - listitem [ref=f33e55]:
              - paragraph [ref=f33e56]: Docker
          - paragraph [ref=f33e57]: Front-End
          - list [ref=f33e58]:
            - listitem [ref=f33e59]:
              - paragraph [ref=f33e60]: StimulusJS or JavaScript ES6
            - listitem [ref=f33e61]:
              - paragraph [ref=f33e62]: Tailwind CSS
            - listitem [ref=f33e63]:
              - paragraph [ref=f33e64]: HTML
            - listitem [ref=f33e65]:
              - paragraph [ref=f33e66]: HTTP
          - paragraph [ref=f33e67]: AI Integration
          - list [ref=f33e68]:
            - listitem [ref=f33e69]:
              - paragraph [ref=f33e70]: Experience integrating AI/ML models (e.g., LLMs, NLP) with web applications
            - listitem [ref=f33e71]:
              - paragraph [ref=f33e72]: Familiarity with LLM frameworks (e.g., LangChain, Hugging Face) or APIs (e.g., xAI, Anthropic)
          - paragraph [ref=f33e73]: Nice-to-Have Technical Skills
          - list [ref=f33e74]:
            - listitem [ref=f33e75]:
              - paragraph [ref=f33e76]: Kubernetes for microservices orchestration
            - listitem [ref=f33e77]:
              - paragraph [ref=f33e78]: React for advanced front-end components
            - listitem [ref=f33e79]:
              - paragraph [ref=f33e80]: Graph databases for complex financial data
            - listitem [ref=f33e81]:
              - paragraph [ref=f33e82]: Contributions to open-source RoR or AI projects
          - paragraph [ref=f33e83]: Required Soft Skills
          - list [ref=f33e84]:
            - listitem [ref=f33e85]:
              - paragraph [ref=f33e86]: Entrepreneurial mindset with a passion for AI and FinTech
            - listitem [ref=f33e87]:
              - paragraph [ref=f33e88]: Natural leader who mentors and inspires teammates
            - listitem [ref=f33e89]:
              - paragraph [ref=f33e90]: Problem-solver with a “get things done” mentality
            - listitem [ref=f33e91]:
              - paragraph [ref=f33e92]: Excellent communication, thriving in remote and cross-team collaboration
            - listitem [ref=f33e93]:
              - paragraph [ref=f33e94]: Attention to detail, ensuring clean, maintainable code
            - listitem [ref=f33e95]:
              - paragraph [ref=f33e96]: Team player comfortable as an individual contributor
          - paragraph [ref=f33e97]: Why Join Us?
          - list [ref=f33e98]:
            - listitem [ref=f33e99]:
              - paragraph [ref=f33e100]: "Impactful Work: Build AI-powered tools that help millions of investors make informed decisions from data-driven insights."
            - listitem [ref=f33e101]:
              - paragraph [ref=f33e102]: "Cutting-Edge Tech: Work with Rails 8, LLMs, and modern tools like Hotwire, Databricks, and xAI’s API in a microservices architecture."
            - listitem [ref=f33e103]:
              - paragraph [ref=f33e104]: "Autonomy and Influence: Collaborate directly with our CEO and CTO to shape our AI-driven platform, with freedom to innovate."
            - listitem [ref=f33e105]:
              - paragraph [ref=f33e106]: "Competitive Compensation: $160,000–$200,000 CAD/USD (based on experience) and benefits."
            - listitem [ref=f33e107]:
              - paragraph [ref=f33e108]: "Remote Flexibility: Remote-first (±3 hours from ET) with hybrid in office collaboration in Toronto or NYC"
            - listitem [ref=f33e109]:
              - paragraph [ref=f33e110]: "Growth Opportunities: Budget for AI and Rails conferences (e.g., NeurIPS, RailsConf), plus access to cutting-edge AI tools for experimentation."
            - listitem [ref=f33e111]:
              - paragraph [ref=f33e112]: "Dynamic Culture: Join a small, no-ego team passionate about trust, innovation, and making a difference in FinTech."
          - paragraph [ref=f33e113]: About Mitre Media’s AI-Driven Platform
          - paragraph [ref=f33e114]:
            - text: Mitre Media powers premium financial brands like
            - link "Dividend.com" [ref=f33e115] [cursor=pointer]:
              - /url: http://dividend.com/
            - text: and
            - link "MutualFunds.com" [ref=f33e116] [cursor=pointer]:
              - /url: http://mutualfunds.com/
            - text: with the Mitre Platform. This platform integrates traditional content management, financial data, first-party data, ad revenue, and subscription tools, all enhanced by LLMs for rich, user-focused experiences. Our data-derived insights delight users, while our advertising solutions deliver unmatched performance for partners like BlackRock and Vanguard, leveraging advanced targeting and first-party data.
          - paragraph [ref=f33e117]: How to Apply
          - paragraph [ref=f33e118]
          - paragraph [ref=f33e119]:
            - generic [ref=f33e120]: Submit your resume, GitHub profile, and a brief note on why you’re excited about building AI-driven FinTech to jobs@mitremedia.com.
