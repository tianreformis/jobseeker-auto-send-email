                  - list [ref=f302e126]:
                    - listitem [ref=f302e127]: 2+ years of professional software engineering
                    - listitem [ref=f302e128]: Code merged into a public open-source repository, ideally one you know well. A private codebase you own may also qualify (not employer or client code)
                    - listitem [ref=f302e129]: Strong in at least one of Python, TypeScript, Go, Rust, Java or C++
                    - listitem [ref=f302e130]: Solid with Docker, Linux, Git and automated testing
                    - listitem [ref=f302e131]: Regular use of an AI coding tool
                    - listitem [ref=f302e132]: Experience writing tests, rubrics or evaluation criteria, ideally for AI models
                    - listitem [ref=f302e133]: You can explain a change clearly and concisely, in your own words
                    - listitem [ref=f302e134]: At least 10 hours a week, starting now
                    - listitem [ref=f302e135]: A secure personal or work computer (no public or shared machines)
