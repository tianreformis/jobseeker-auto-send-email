                - generic [ref=f302e101]:
                  - paragraph [ref=f302e102]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
                  - paragraph [ref=f302e103]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
                  - paragraph [ref=f302e104]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
                  - paragraph [ref=f302e105]
                  - paragraph [ref=f302e106]:
                    - strong [ref=f302e107]: How it works
                  - list [ref=f302e108]:
                    - listitem [ref=f302e109]:
                      - strong [ref=f302e110]: Apply.
                      - text: Complete a short screener interview and upload your resume.
                    - listitem [ref=f302e111]:
                      - strong [ref=f302e112]: Propose.
                      - text: Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
                    - listitem [ref=f302e113]:
                      - strong [ref=f302e114]: Build.
                      - text: In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
                    - listitem [ref=f302e115]:
                      - strong [ref=f302e116]: Stress-test.
                      - text: Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
                    - listitem [ref=f302e117]:
                      - strong [ref=f302e118]: Model testing.
                      - text: Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
                    - listitem [ref=f302e119]:
                      - strong [ref=f302e120]: Review.
                      - text: A reviewer checks your task and you revise it. Most tasks take more than one round.
                    - listitem [ref=f302e121]:
                      - strong [ref=f302e122]: Next task.
                      - text: Once your task is accepted, start another.
                  - paragraph [ref=f302e123]
                  - paragraph [ref=f302e124]:
