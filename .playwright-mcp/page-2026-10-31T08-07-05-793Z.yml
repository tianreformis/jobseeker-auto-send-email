          - paragraph [ref=f65e66]:
            - emphasis [ref=f65e67]: Remote | Americas, Europe, or Israel
          - paragraph [ref=f65e68]: Most AI engineers can find work.
          - paragraph [ref=f65e69]: Finding work worth doing is harder.
          - paragraph [ref=f65e70]: A.Team is an invite-only network of senior AI engineers, ML engineers, and AI architects working on production AI systems for startups, scale-ups, and global companies.
          - paragraph [ref=f65e71]: Since 2020, builders in the network have earned more than $200M working with companies including Lyft, Google X, HCA, Unilever, Sightful, D-ID, and others.
          - paragraph [ref=f65e72]:
            - strong [ref=f65e73]: The Work
          - paragraph [ref=f65e74]: You'll join small teams tackling problems that matter.
          - paragraph [ref=f65e75]: Not demos.
          - paragraph [ref=f65e76]: Not prototypes that never ship.
          - paragraph [ref=f65e77]: Not another chatbot wrapper.
          - paragraph [ref=f65e78]: Real systems. Real users. Real outcomes.
          - paragraph [ref=f65e79]:
            - strong [ref=f65e80]: "Recent work has included:"
          - paragraph [ref=f65e81]: "- LLM-powered products and workflows- Agent architectures and orchestration systems- Retrieval, evaluation, and reliability infrastructure- Enterprise AI deployments- AI-native products built from zero to one- Machine learning platforms operating at scale"
          - paragraph [ref=f65e82]: You'll work directly with founders, CTOs, and product leaders, helping shape both the technical approach and the outcome.
          - paragraph [ref=f65e83]:
            - strong [ref=f65e84]: Why Builders Join
          - paragraph [ref=f65e85]: "Most independent engineers eventually run into the same problem:"
          - paragraph [ref=f65e86]: The best opportunities rarely make it to the open market.
          - paragraph [ref=f65e87]: A.Team exists to solve that.
          - paragraph [ref=f65e88]: No bidding.
          - paragraph [ref=f65e89]: No prospecting.
          - paragraph [ref=f65e90]: No competing with thousands of other freelancers.
          - paragraph [ref=f65e91]: Just access to ambitious companies, difficult problems, and experienced peers.
          - paragraph [ref=f65e92]:
            - strong [ref=f65e93]: Who Thrives Here
          - paragraph [ref=f65e94]: People who have already shipped.
          - paragraph [ref=f65e95]: Engineers who have deployed AI systems into production, understand the tradeoffs behind the hype, and know how to turn research into business value.
          - paragraph [ref=f65e96]:
            - emphasis [ref=f65e97]: "You might be an:"
          - paragraph [ref=f65e98]: "- AI Architect- AI Engineer- MLOps- Deep Learning Engineer- Data Scientist- Applied AI Engineer- ML Engineer- AI Researcher- Staff+ Engineer focused on AI- Technical founder with deep AI experience"
          - paragraph [ref=f65e99]: What matters is a track record of building and shipping.
