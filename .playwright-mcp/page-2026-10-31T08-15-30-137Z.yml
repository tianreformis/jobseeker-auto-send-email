                  - text: Klardaten is hiring a
                  - heading "Remote Senior Software Engineer" [level=1] [ref=f94e149]
                - generic [ref=f94e150]:
                  - paragraph [ref=f94e151]: Klardaten connects DATEV with other software and AI applications. We’re hiring 1–2 senior engineers to own product development, DATEV integrations and automation.
                  - paragraph [ref=f94e152]:
                    - strong [ref=f94e153]: Based in the EU · Remote or Berlin · Full time · Permanent or contract · Start as soon as possible
                  - heading "Own the outcome" [level=2] [ref=f94e154]
                  - paragraph [ref=f94e155]: Once we agree on a general goal, you independently work out what to build and how to deliver it. You investigate the problem, define the scope, make technical decisions and carry the work through implementation, testing, deployment and follow-up.
                  - heading "What you will do" [level=2] [ref=f94e156]
                  - list [ref=f94e157]:
                    - listitem [ref=f94e158]: Turn general product goals into clear requirements, a practical scope and technical decisions.
                    - listitem [ref=f94e159]: Build product features, DATEV integrations and automations across frontend and backend.
                    - listitem [ref=f94e160]: Own testing, deployment and ongoing improvement, including resolving problems in production.
                    - listitem [ref=f94e161]: Find answers, resolve blockers and keep the founders informed. Raise decisions that need discussion early.
                  - heading "Examples of goals" [level=2] [ref=f94e162]
                  - list [ref=f94e163]:
                    - listitem [ref=f94e164]: Make connecting a DATEV environment easier and reduce manual setup.
                    - listitem [ref=f94e165]: Give customers access to a new DATEV data area through our API and MCP server.
                    - listitem [ref=f94e166]: Turn a recurring manual workflow into a reliable automation that users can review.
                  - heading "What you bring" [level=2] [ref=f94e167]
                  - list [ref=f94e168]:
                    - listitem [ref=f94e169]: Strong production TypeScript experience across frontend and backend.
                    - listitem [ref=f94e170]: Experience independently shipping and maintaining software from a general goal, without detailed specifications, predefined tickets or day-to-day task management.
                    - listitem [ref=f94e171]: Practical experience with APIs, databases, authentication and reliable error handling for integrations and automations.
                    - listitem [ref=f94e172]: Testing, deployment and production debugging skills, and the ability to verify AI-generated code and results.
                    - listitem [ref=f94e173]: Clear written and spoken English for day-to-day collaboration.
                  - paragraph [ref=f94e174]: C#/.NET, DATEV integration experience and German are helpful.
                  - heading "How we work" [level=2] [ref=f94e175]
                  - paragraph [ref=f94e176]: You work directly with the founders and the team. We provide business context and agree on goals and priorities. You take ownership of reaching them, communicate progress and use your judgment about when to proceed and when a decision needs discussion.
                  - heading "Compensation" [level=2] [ref=f94e177]
                  - paragraph [ref=f94e178]: "Gross annual salary: €72,000–90,000, depending on experience. Full-time contractors are also welcome."
