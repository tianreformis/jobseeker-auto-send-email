        - generic [ref=f126e59]:
          - generic [ref=f126e60]:
            - heading "About Vercel:" [level=2] [ref=f126e61]
            - paragraph [ref=f126e62]: Vercel is the agentic infrastructure company, freeing people and agents to ship what's next. For more than a decade we've helped builders move from idea to production with speed, security, and exceptional developer experience.
            - paragraph [ref=f126e63]: Now we're scaling our products for both agents and people to ship and run software, built in the open and trusted by OpenAI, PayPal, Ramp, Supreme, and millions of developers worldwide.
          - heading "About the Role:" [level=2] [ref=f126e64]
          - paragraph [ref=f126e65]: We are seeking a Backend leaning Software Engineer. In this role, you will play a pivotal role in designing, building, and maintaining scalable, high-performance systems. Leveraging JavaScript/TypeScript, Node.js, SQL and NoSQL cloud-native databases, and AWS, you will develop innovative solutions for user, group, and membership management while ensuring the highest levels of security and reliability.
          - paragraph [ref=f126e66]: If you’re based within a pre-determined commuting distance of one of our offices (SF, NY, London, or Berlin), the role includes in-office anchor days on Monday, Tuesday, and Friday. If you're located beyond that distance, the role is fully remote. For location-specific details, please connect with our recruiting team.
          - heading "What You Will Do:" [level=2] [ref=f126e67]
          - list [ref=f126e68]:
            - listitem [ref=f126e69]: Enable us to deliver secure, reliable, and scalable services that exceed industry standards and customer expectations.
            - listitem [ref=f126e70]: Collaborate with cross-functional teams to deliver large-scale projects with cross-team dependencies.
            - listitem [ref=f126e71]: Collaborate with peer teams to deliver solutions that meet industry standards and customer expectations.
            - listitem [ref=f126e72]: Maintain and operate services at high scale, participating in scheduled on-call rotations to ensure reliability.
            - listitem [ref=f126e73]: Implement identity synchronization and lifecycle management solutions using SCIM and other relevant standards.
            - listitem [ref=f126e74]: Work with Infrastructure as Code (Terraform, AWS CloudFormation, Kubernetes, etc.) to deliver scalable, high-availability applications.
            - listitem [ref=f126e75]: Build and maintain high-quality enterprise software using TypeScript, REST APIs, and JSON.
          - heading "About You:" [level=2] [ref=f126e76]
          - list [ref=f126e77]:
            - listitem [ref=f126e78]: Proficiency in TypeScript/JavaScript, React, and Node.js.
            - listitem [ref=f126e79]: Strong knowledge of security architecture, LDAP, Active Directory, SAML, SSO, OAuth2, OpenID Connect and web protocols like XML, SOAP, JSON, and REST.
            - listitem [ref=f126e80]: Familiarity with access control models such as RBAC, ABAC and ReBAC.
            - listitem [ref=f126e81]: Experience with SQL.
            - listitem [ref=f126e82]: Practical experience developing and improving applications written in Node.js.
            - listitem [ref=f126e83]: Exhibit excellent problem-solving abilities and effective communication skills, especially when collaborating with diverse teams.
          - heading "Benefits & Compensation:" [level=2] [ref=f126e84]
          - list [ref=f126e85]:
            - listitem [ref=f126e86]: Competitive compensation package, including equity.
            - listitem [ref=f126e87]: Inclusive Healthcare Package.
            - listitem [ref=f126e88]: Learn and Grow - we provide mentorship and send you to events that help you build your network and skills.
            - listitem [ref=f126e89]: Flexible Time Off.
            - listitem [ref=f126e90]: We will provide you the gear you need to do your role, and a WFH budget for you to outfit your space as needed.
          - paragraph [ref=f126e91]: The San Francisco, CA base pay range for this role is $196,000-$294,000. Actual salary will be based on job-related skills, experience, and location. Compensation outside of San Francisco may be adjusted based on employee location. The total compensation package may include benefits, equity-based compensation, and eligibility for a company bonus or variable pay program depending on the role. Your recruiter can share more details during the hiring process.
