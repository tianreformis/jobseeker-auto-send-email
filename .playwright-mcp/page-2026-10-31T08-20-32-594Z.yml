                - generic [ref=f279e101]:
                  - paragraph [ref=f279e102]: We're looking for experienced software engineers to build AI coding tasks from a codebase they know well. US$1,000 per task, and you can do as many tasks as you want.
                  - paragraph [ref=f279e103]: "You turn a real change from a repository you know into a task that today's best AI coding models struggle with: hard for the models, but fair for a skilled engineer. Your tasks are used to measure and train AI coding models."
                  - paragraph [ref=f279e104]: Remote, any location. US$1,000 per task that passes review. Minimum of one task a week, about 10 hours a week.
                  - paragraph [ref=f279e105]
                  - paragraph [ref=f279e106]:
                    - strong [ref=f279e107]: How it works
                  - list [ref=f279e108]:
                    - listitem [ref=f279e109]:
                      - strong [ref=f279e110]: Apply.
                      - text: Complete a short screener interview and upload your resume.
                    - listitem [ref=f279e111]:
                      - strong [ref=f279e112]: Propose.
                      - text: Once you're selected, pick a change from a repository you know and submit a short proposal. We approve it or suggest a better candidate.
                    - listitem [ref=f279e113]:
                      - strong [ref=f279e114]: Build.
                      - text: In our platform, set up the repository as it was before the change, then write the brief, the correct solution and the grading checks.
                    - listitem [ref=f279e115]:
                      - strong [ref=f279e116]: Stress-test.
                      - text: Try lazy, incorrect and shortcut solutions and make sure your checks catch them.
                    - listitem [ref=f279e117]:
                      - strong [ref=f279e118]: Model testing.
                      - text: Run your task against leading AI models until strong models often fail but a skilled engineer can clearly solve it.
                    - listitem [ref=f279e119]:
                      - strong [ref=f279e120]: Review.
                      - text: A reviewer checks your task and you revise it. Most tasks take more than one round.
                    - listitem [ref=f279e121]:
                      - strong [ref=f279e122]: Next task.
                      - text: Once your task is accepted, start another.
                  - paragraph [ref=f279e123]
                  - paragraph [ref=f279e124]:
                    - strong [ref=f279e125]: Requirements
                  - list [ref=f279e126]:
                    - listitem [ref=f279e127]: 2+ years of professional software engineering
                    - listitem [ref=f279e128]: Code merged into a public open-source repository, ideally one you know well. A private codebase you own may also qualify (not employer or client code)
                    - listitem [ref=f279e129]: Strong in at least one of Python, TypeScript, Go, Rust, Java or C++
                    - listitem [ref=f279e130]: Solid with Docker, Linux, Git and automated testing
                    - listitem [ref=f279e131]: Regular use of an AI coding tool
                    - listitem [ref=f279e132]: Experience writing tests, rubrics or evaluation criteria, ideally for AI models
                    - listitem [ref=f279e133]: You can explain a change clearly and concisely, in your own words
                    - listitem [ref=f279e134]: At least 10 hours a week, starting now
                    - listitem [ref=f279e135]: A secure personal or work computer (no public or shared machines)
                  - paragraph [ref=f279e136]
                  - paragraph [ref=f279e137]:
