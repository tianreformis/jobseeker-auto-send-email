          - paragraph [ref=f151e60]: Summary
          - paragraph [ref=f151e61]: We are seeking a Full-Stack Developer to build or customize a dealer e-commerce platform connected to an existing Sage X3 ERP environment. The role is focused on selecting the right e-commerce approach, implementing the portal, and supporting dealer-facing workflows in a manufacturing context.
          - paragraph [ref=f151e62]: General information
          - paragraph [ref=f151e63]: This engagement centers on building an e-commerce portal for dealers on top of an existing Sage X3 ERP setup. The client is open to the e-commerce technology choice and is looking for an experienced developer who can assess the current environment, recommend an appropriate platform approach, and deliver the required solution.
          - paragraph [ref=f151e64]: The work is fully remote and involves integrating the portal with Sage X3 while supporting the underlying commerce and data flows required for dealer operations.
          - paragraph [ref=f151e65]: Tasks and Deliverables
          - paragraph [ref=f151e66]: Assess the current Sage X3 environment and recommend the e-commerce platform approach.
          - paragraph [ref=f151e67]: Build or customize a dealer e-commerce portal on top of the existing ERP.
          - paragraph [ref=f151e68]: Integrate the platform with Sage X3 using SOAP and GraphQL APIs.
          - paragraph [ref=f151e69]: Develop full-stack functionality using the selected commerce stack and supporting technologies.
          - paragraph [ref=f151e70]: Implement dealer-facing workflows, data exchange, and platform customizations required for launch.
          - paragraph [ref=f151e71]: Required experience
          - paragraph [ref=f151e72]: Strong hands-on experience with Sage X3 integration.
          - paragraph [ref=f151e73]: Proven full-stack development experience with Python and JavaScript.
          - paragraph [ref=f151e74]: Experience with Node.js, PHP, MySQL, and CSS.
          - paragraph [ref=f151e75]: Experience working with REST, SOAP and GraphQL APIs.
          - paragraph [ref=f151e76]: "Nice to have:"
          - paragraph [ref=f151e77]: Manufacturing industry experience.
          - separator [ref=f151e78]
