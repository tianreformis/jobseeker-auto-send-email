                - generic [ref=f8e104]:
                  - paragraph [ref=f8e105]: "About B2Spin We are B2Spin, and we are dedicated to delivering the best Free-to-Play Social Casino and gaming experiences by creating captivating, engaging, and unique products that are accessible to everyone. We have built a team of talented professionals from all over the globe, who are working to continually improve the experiences of our players. We are not looking to just be part of the industry, but to revolutionize it.AI-Driven Engineering CultureWe are actively building an AI-driven engineering organization with a clear and deliberate stance: artificial intelligence is a core part of how we build and deliver software — not an experiment, not a trend, and not an optional add-on."
                  - paragraph [ref=f8e106]: "AI is embedded into our engineering workflows, from system design and prototyping to refactoring, testing, and code review. We expect engineers to be fully comfortable working in AI-driven environments and to treat AI as a primary productivity multiplier. Strong engineering judgment, architectural ownership, and accountability remain essential—AI amplifies our engineers, it doesn’t replace responsibility for technical decisions.What you will be doing: • Write well-designed, testable, and scalable code that performs flawlessly in production; • Take part in the full development cycle from sprint planning to release cycles; • Ensure smooth development and cooperation between dev teams and product owners; • Build customer-facing consumer web and mobile applications for global audiences; • Implement third-party integrations including external APIs and analytics; • Optimize for SEO performance and PageSpeed improvements.What we are looking for: • Strong commercial experience in React, TypeScript and Next.js; • Motivation to grow into cross-platform development (web and mobile). • End-to-end thinking across frontend, backend, and infrastructure. Willingness to contribute beyond frontend scope when needed. • Solid expertise with HTML/CSS, including responsive and cross-browser development; • Experience with third-party integrations (external APIs, analytics); • Proven track record with SEO optimizations and PageSpeed improvements; • Strong UI/UX experience with Figma; • Good English skills in speaking and writing (B2+).Why you will love it:High Pace, High Growth, Real Impact — You’ll thrive in our culture of rapid development, continuous learning, and meaningful outcomes. Work remotely with full flexibility, enjoy generous leave policies, and be part of company events that build genuine connections. Every line of code you write directly impacts millions of users worldwide, and you’ll see your contributions shape the future of social gaming while advancing your career in a supportive, ego-free environment.Benefits:Generous Leave Policy: Take advantage of paid time off, encompassing both vacation and sick leave, to ensure you can recharge and recover when needed. Take your time on bank holidays as well.Continuously Development: Get an opportunity to join a fast-growing business where the sky’s the limit.Company Events: Engage in our vibrant company culture through a variety of informal events designed to foster camaraderie and teamwork.Full Remote Work: Enjoy the flexibility of working remotely from wherever you feel most productive."
