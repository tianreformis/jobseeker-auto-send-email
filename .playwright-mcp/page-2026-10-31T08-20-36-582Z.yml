            - emphasis [ref=f282e67]: Remote | Americas, Europe, or Israel
          - paragraph [ref=f282e68]: Most AI engineers can find work.
          - paragraph [ref=f282e69]: Finding work worth doing is harder.
          - paragraph [ref=f282e70]: A.Team is an invite-only network of senior AI engineers, ML engineers, and AI architects working on production AI systems for startups, scale-ups, and global companies.
          - paragraph [ref=f282e71]: Since 2020, builders in the network have earned more than $200M working with companies including Lyft, Google X, HCA, Unilever, Sightful, D-ID, and others.
          - paragraph [ref=f282e72]:
            - strong [ref=f282e73]: The Work
          - paragraph [ref=f282e74]: You'll join small teams tackling problems that matter.
          - paragraph [ref=f282e75]: Not demos.
          - paragraph [ref=f282e76]: Not prototypes that never ship.
          - paragraph [ref=f282e77]: Not another chatbot wrapper.
          - paragraph [ref=f282e78]: Real systems. Real users. Real outcomes.
          - paragraph [ref=f282e79]:
            - strong [ref=f282e80]: "Recent work has included:"
          - paragraph [ref=f282e81]: "- LLM-powered products and workflows- Agent architectures and orchestration systems- Retrieval, evaluation, and reliability infrastructure- Enterprise AI deployments- AI-native products built from zero to one- Machine learning platforms operating at scale"
          - paragraph [ref=f282e82]: You'll work directly with founders, CTOs, and product leaders, helping shape both the technical approach and the outcome.
          - paragraph [ref=f282e83]:
            - strong [ref=f282e84]: Why Builders Join
          - paragraph [ref=f282e85]: "Most independent engineers eventually run into the same problem:"
          - paragraph [ref=f282e86]: The best opportunities rarely make it to the open market.
          - paragraph [ref=f282e87]: A.Team exists to solve that.
          - paragraph [ref=f282e88]: No bidding.
          - paragraph [ref=f282e89]: No prospecting.
          - paragraph [ref=f282e90]: No competing with thousands of other freelancers.
          - paragraph [ref=f282e91]: Just access to ambitious companies, difficult problems, and experienced peers.
          - paragraph [ref=f282e92]:
            - strong [ref=f282e93]: Who Thrives Here
          - paragraph [ref=f282e94]: People who have already shipped.
          - paragraph [ref=f282e95]: Engineers who have deployed AI systems into production, understand the tradeoffs behind the hype, and know how to turn research into business value.
          - paragraph [ref=f282e96]:
            - emphasis [ref=f282e97]: "You might be an:"
