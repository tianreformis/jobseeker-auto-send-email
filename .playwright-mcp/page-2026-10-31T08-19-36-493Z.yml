            - listitem [ref=f174e59]: Strong self-organizational skills — ability to work full-time remotely with no supervision.
            - listitem [ref=f174e60]: Reliability — we want to trust you and expect that you won’t let us and the client down.
            - listitem [ref=f174e61]: Adaptability and Flexibility — the ability to onboard the project promptly after accepting it and start delivering results quickly.
