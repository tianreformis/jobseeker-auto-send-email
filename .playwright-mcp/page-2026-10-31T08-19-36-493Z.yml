            - strong [ref=f174e29]
          - paragraph [ref=f174e30]:
            - strong [ref=f174e31]: "What we offer:"
          - list [ref=f174e32]:
            - listitem [ref=f174e33]: The rate depends on your seniority level, skills and experience. We've already paid out over $11M to our engineers.
            - listitem [ref=f174e34]: No more hunting for clients or negotiating rates — let us handle the business side of things so you can focus on what you do best.
            - listitem [ref=f174e35]: We'll manually find the best project for you according to your skills and preferences.
            - listitem [ref=f174e36]: Choose a schedule that works best for you. It’s possible to communicate async or minimally overlap within team working hours.
            - listitem [ref=f174e37]: We respect your seniority so you can expect no micromanagement or screen trackers.
            - listitem [ref=f174e38]: Communicate directly with the clients. Most of them have technical backgrounds. Sounds good, yeah?
            - listitem [ref=f174e39]: We will support you from the time you submit the application throughout all cooperation stages.
            - listitem [ref=f174e40]: Most of our projects involve working in a fast-paced startup environment. We hope you like it as much as we do.
          - paragraph [ref=f174e41]
          - strong [ref=f174e43]: "Requirements for the Senior React & Python Position:"
          - list [ref=f174e44]:
            - listitem [ref=f174e45]: 4+ years of software development experience.
          - paragraph [ref=f174e46]: "Commercial experience:"
          - list [ref=f174e47]:
