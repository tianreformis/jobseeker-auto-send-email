                  - text: Wrapbook is hiring a
                  - heading "Remote Senior Software Engineer II Applied AI" [level=1] [ref=f98e106]
                - generic [ref=f98e107]:
                  - paragraph [ref=f98e108]: "About Us:Wrapbook is the AI platform for production finance. We’re building a system of action that puts finance teams in control of their whole production, from payroll, to spend, to accounting. Built for feature films, TV, and commercials, Wrapbook is trusted by teams at Netflix, Paramount, Anonymous Content, and more. With backing from Andreessen Horowitz, Bessemer Venture Partners, and Jeffrey Katzenberg's WndrCo, our team of 350+ is using AI to transform how finance teams work and empower them to do more with less.The Opportunity: Senior Software Engineer II, Applied AI (Remote - USA / Canada) We are looking for a Senior Software Engineer II, Applied AI to join our Agentic Systems team, where you'll build AI agents that automate workflows for teams across Wrapbook. You'll partner directly with internal teams like Marketing, Sales, Support, Operations and Finance to find high-leverage processes, then design, ship and iterate on agents that take real work off their plates. This is a chance to define how a 400+ person company runs on AI. You'll see the impact of your work every day, while shaping the patterns, tools and standards for how we build agents at Wrapbook.What You’ll Do:* Design and build production-grade AI agents with LangGraph that automate multi-step workflows for internal teams across Wrapbook"
                  - list [ref=f98e109]:
                    - listitem [ref=f98e110]: Deploy, run and scale agents on Amazon Bedrock AgentCore, using its runtime, memory, identity and gateway capabilities to make them secure and reliable, while tracking what they cost to run and keeping it efficient as usage grows
                    - listitem [ref=f98e111]: Partner with internal teams to find high-impact workflows, draw out requirements from people who can't hand you a spec, and turn them into agent-driven solutions, explaining clearly what each agent can and can't reliably do
                    - listitem [ref=f98e112]: Integrate agents with Wrapbook's internal systems, APIs and third-party tools so they can take real actions, not just answer questions
                    - listitem [ref=f98e113]: Build evaluation, observability and guardrail frameworks to measure agent quality, catch failures and keep humans in the loop where it matters
                    - listitem [ref=f98e114]: Establish reusable patterns, shared tools and best practices that let the Agentic Systems team ship new agents quickly and consistently
                    - listitem [ref=f98e115]: Own agents end to end, from prototype to production, measuring their impact on the teams they serve and iterating based on usage data and feedback
                    - listitem [ref=f98e116]: Drive adoption through clear documentation, training and enablement, so teams understand what each agent does, trust it and know how to get the most from it
                  - paragraph [ref=f98e117]: What You’ll Have:* 6+ years of back-end development experience with Python, TypeScript/Node.js or Java, with a track record of delivering systems built for security, scalability, availability and performance
                  - list [ref=f98e118]:
                    - listitem [ref=f98e119]: "Hands-on experience building and shipping LLM-powered agents or workflows (with models such as Claude, GPT, Llama or Mistral), including prompting, tool use and structured outputs. You can walk us through one you built: how it was designed, what broke and how you fixed it"
                    - listitem [ref=f98e120]: Production experience with at least one agent or LLM framework, such as LangGraph, LangChain, LlamaIndex or AutoGen, and a solid understanding of AI architectures like RAG, reranking and multi-agent orchestration. Experience with LangGraph specifically is a plus
                    - listitem [ref=f98e121]: "A security-first mindset: you think about data access, permissions and failure modes in everything you build, especially when agents can take real actions"
                    - listitem [ref=f98e122]: Strong product sense and communication skills, with the ability to work directly with non-technical teams to understand their workflows and turn them into reliable automation
                    - listitem [ref=f98e123]: "Comfort with ambiguity and an ownership mentality: you can take a loosely defined problem from idea to production on your own"
                    - listitem [ref=f98e124]: "Nice to have: experience running AWS workloads in production and knowing how to design for, deploy on and get the most out of Amazon's services, ideally including Amazon Bedrock AgentCore"
                  - paragraph [ref=f98e125]: Why Join Us:At Wrapbook, creativity meets technology — and not just in the product.In addition to a competitive salary and all the benefits you can expect from a fast-growing technology company, you’ll get access to a team of creative problem solvers and the chance to see your contributions make large impacts Benefits include:* Unlimited Paid Time Off
                  - list [ref=f98e126]:
                    - listitem [ref=f98e127]: Work from anywhere in Canada and USA
                    - listitem [ref=f98e128]: Health and Dental benefits
                    - listitem [ref=f98e129]: Up to $1,500 USD/ $2,025 CAD towards IT set up for your home
                    - listitem [ref=f98e130]: Up to 2% matching RRSP / 401K
                    - listitem [ref=f98e131]: Learning and Development opportunities
                    - listitem [ref=f98e132]: Up to $50 USD/ $67.50 CAD towards Internet/Cell phone service
                  - paragraph [ref=f98e133]: Our Pledge to Fostering an Inclusive and Safe Workplace:Wrapbook pledges to be a harassment- and discrimination-free space for everyone, regardless of age, disability, ethnicity, gender identity or expression, nationality, neurotype, personal appearance, political affiliation, professional background, race, religion, or sexual identity or orientation.Apply NowHave we got your attention? Submit your application today and a member of our Talent team will be in touch with you shortly!#LI-Remote
